<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karmelo | Official Hub</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #030303;
            --glass: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.08);
            --glow: rgba(255, 255, 255, 0.4);
            --accent-yt: #ff0000;
            --accent-tw: #9146ff;
            --accent-tt: #00f2fe; 
            --accent-ig: #c13584; 
            --accent-dc: #5865F2; 
        }

        /* CAŁKOWITE UKRYCIE SYSTEMOWEGO PASKA */
        ::-webkit-scrollbar { width: 0px; display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; overflow-y: scroll; }

        /* KONTENER DLA PŁYNNEGO SUWAKA */
        .liquid-container {
            position: fixed;
            right: 8px;
            top: 0;
            width: 20px;
            height: 100vh;
            z-index: 10000;
            pointer-events: none;
            filter: url('#liquid-goo'); /* To nakłada efekt cieczy */
        }

        .liquid-thumb {
            position: absolute;
            width: 12px;
            min-height: 12px;
            background: #fff;
            border-radius: 50%; /* Startuje jako kropka/koło */
            right: 4px;
            pointer-events: auto;
            cursor: grab;
            box-shadow: 0 0 20px rgba(255,255,255,0.6);
            transition: width 0.3s, background 0.3s, box-shadow 0.3s;
            will-change: transform, height;
        }

        .liquid-thumb:hover {
            width: 18px;
            box-shadow: 0 0 30px rgba(255,255,255,1);
            background: #f0f0f0;
        }

        /* Fundamenty strony */
        * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; line-height: 1.6; overflow-x: hidden; }

        .ambient-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% -20%, rgba(255,255,255,0.05) 0%, transparent 50%),
                        radial-gradient(circle at 0% 100%, rgba(145,70,255,0.03) 0%, transparent 40%);
            z-index: -1;
        }

        #pixel-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

        /* NAWIGACJA */
        .top-nav {
            position: fixed; top: 0; left: 50%; transform: translateX(-50%);
            background: radial-gradient(ellipse at top, rgba(255,255,255,0.15) 0%, transparent 70%);
            border-top: 1px solid rgba(255,255,255,0.2);
            padding: 20px 50px 30px 50px; z-index: 1000; display: flex; gap: 35px;
            width: 100%; max-width: 600px; justify-content: center;
        }
        .top-nav a { color: #888; text-decoration: none; font-size: 11px; font-weight: 500; letter-spacing: 3px; transition: 0.3s; text-transform: uppercase; }
        .top-nav a:hover { color: white; text-shadow: 0 0 15px rgba(255,255,255,0.8); }

        /* HERO */
        .hero { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; position: relative; z-index: 1; }
        .avatar-box { position: relative; width: 140px; height: 140px; margin-bottom: 25px; animation: float 6s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .profile-img { width: 100%; height: 100%; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 0 40px rgba(255,255,255,0.1); object-fit: cover; }
        .status-dot { position: absolute; bottom: 8px; right: 8px; background: #00ff00; color: black; font-size: 8px; font-weight: 900; padding: 3px 8px; border-radius: 20px; box-shadow: 0 0 15px #00ff00; }
        h1 { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 800; letter-spacing: -1px; text-transform: uppercase; color: #ccc; }
        h1 span { font-size: clamp(2.5rem, 7vw, 4.5rem); background: linear-gradient(to right, #ffffff, #888888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: block; }

        .hero-stats { display: flex; gap: 40px; margin: 30px 0; background: var(--glass); padding: 20px 40px; border-radius: 20px; border: 1px solid var(--border); }
        .stat-item b { font-size: 1.4rem; display: block; color: #fff;}
        .stat-item span { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 1.5px; }

        .socials { display: flex; gap: 12px; justify-content: center; }
        .btn-social { background: var(--glass); border: 1px solid var(--border); color: white; padding: 12px 22px; border-radius: 12px; text-decoration: none; transition: 0.3s; }
        .btn-social:hover { transform: translateY(-3px); background: #fff; color: #000; }
        .btn-yt:hover { background: var(--accent-yt); color: #fff; }

        /* SEKCJE */
        section { padding: 100px 5%; max-width: 1100px; margin: 0 auto; opacity: 0; transform: translateY(30px); transition: 1s; position: relative; z-index: 1;}
        section.visible { opacity: 1; transform: translateY(0); }
        h2 { font-size: 1.2rem; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 40px; text-align: center; color: #666; }
        .glass-card { background: var(--glass); border: 1px solid var(--border); padding: 40px; border-radius: 20px; }

        .grid-experience { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .exp-card { background: linear-gradient(145deg, rgba(255,255,255,0.02), transparent); border: 1px solid var(--border); padding: 30px; border-radius: 20px; transition: 0.3s; }

        .shorts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }

    </script>

</body>
</html>
