<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karmelo | Official Hub</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* --- 1. ZMIENNE I SCROLLBAR --- */
        :root {
            --bg: #030303;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --glow-main: rgba(255, 255, 255, 0.6);
            --yt: #ff0000;
            --tw: #9146ff;
            --tt: #ff0050; /* TikTok */
            --ig: #e1306c; /* Instagram */
            --dc: #5865F2;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { 
            background: linear-gradient(var(--bg), var(--glow-main), var(--bg));
            border-radius: 100px;
            border: 2px solid #050505;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }

        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% -10%, rgba(255,255,255,0.1) 0%, transparent 50%);
            z-index: -1;
        }

        /* --- 2. NAWIGACJA --- */
        .top-nav {
            position: fixed; top: 25px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(30px);
            border: 1px solid var(--border); padding: 12px 30px; border-radius: 100px;
            z-index: 1000; display: flex; gap: 25px;
        }
        .top-nav a { color: #666; text-decoration: none; font-size: 10px; font-weight: 900; letter-spacing: 2px; transition: 0.3s; }
        .top-nav a:hover { color: white; text-shadow: 0 0 15px white; }

        /* --- 3. HERO (POPRAWIONY NAPIS) --- */
        .hero { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        
        .avatar-box {
            width: 150px; height: 150px; margin-bottom: 20px; position: relative;
            animation: float 5s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        
        .profile-img { width: 100%; height: 100%; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 60px rgba(255,255,255,0.2); }

        .hero h1 { 
            font-size: clamp(3rem, 10vw, 5.5rem); font-weight: 900; letter-spacing: -4px; 
            text-transform: uppercase; line-height: 0.9;
            background: linear-gradient(to bottom, #fff 30%, #444 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(255,255,255,0.3));
        }

        /* --- 4. SOCIALS (WSZYSTKIE KOLORY) --- */
        .socials { display: flex; gap: 15px; margin-top: 30px; }
        .btn-s {
            width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            background: var(--glass); border: 1px solid var(--border); border-radius: 50%;
            color: white; font-size: 1.2rem; transition: 0.4s; text-decoration: none;
        }
        .btn-s:hover { transform: scale(1.1) translateY(-5px); color: white; border-color: white; }
        
        .yt:hover { background: var(--yt); box-shadow: 0 0 30px var(--yt); }
        .tt:hover { background: var(--tt); box-shadow: 0 0 30px var(--tt); }
        .ig:hover { background: var(--ig); box-shadow: 0 0 30px var(--ig); }
        .tw:hover { background: var(--tw); box-shadow: 0 0 30px var(--tw); }

        /* --- 5. SEKCJE --- */
        section { padding: 100px 5%; max-width: 1100px; margin: 0 auto; opacity: 0; transform: translateY(40px); transition: 1.2s; }
        section.visible { opacity: 1; transform: translateY(0); }
        h2 { text-align: center; margin-bottom: 50px; font-size: 1rem; letter-spacing: 5px; color: #555; text-transform: uppercase; }

        .shorts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .short-card { aspect-ratio: 9/16; border-radius: 20px; overflow: hidden; border: 1px solid var(--border); transition: 0.4s; }
        .short-card:hover { border-color: white; box-shadow: 0 0 40px rgba(255,255,255,0.1); }
        .short-card iframe { width: 100%; height: 100%; border: none; }

        /* --- 6. KONTAKT & DISCORD --- */
        .contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        
        .contact-card {
            background: var(--glass); border: 1px solid var(--border);
            padding: 40px; border-radius: 30px; backdrop-filter: blur(20px);
            position: relative; overflow: hidden;
        }

        .dc-btn {
            background: var(--dc); color: white; border: none; padding: 15px;
            width: 100%; border-radius: 15px; font-weight: 900; cursor: pointer;
            margin-top: 20px; transition: 0.3s;
        }
        .dc-btn:hover { box-shadow: 0 0 30px var(--dc); transform: translateY(-2px); }

        input, textarea {
            width: 100%; background: rgba(255,255,255,0.02); border: 1px solid var(--border);
            padding: 15px; margin-bottom: 15px; color: white; border-radius: 12px; font-family: inherit;
        }
        .send-btn {
            width: 100%; padding: 15px; background: white; color: black; border: none;
            border-radius: 12px; font-weight: 900; cursor: pointer; transition: 0.3s;
        }
        .send-btn:hover { box-shadow: 0 0 30px white; transform: translateY(-2px); }

    </style>
</head>
<body>

    <div class="ambient-bg"></div>

    <nav class="top-nav">
        <a href="#about">O MNIE</a>
        <a href="#portfolio">PORTFOLIO</a>
        <a href="#contact">KONTAKT</a>
    </nav>

    <header class="hero">
        <div class="avatar-box">
            <img src="profil.jpg" alt="Karmelo" class="profile-img">
        </div>
        <h1>SIEMA, TU<br>KARMELO</h1>
        
        <div class="socials">
            <a href="https://youtube.com/@kvrmelo" class="btn-s yt"><i class="fab fa-youtube"></i></a>
            <a href="https://tiktok.com/@kvrmelo" class="btn-s tt"><i class="fab fa-tiktok"></i></a>
            <a href="https://instagram.com/kvrmelo" class="btn-s ig"><i class="fab fa-instagram"></i></a>
            <a href="https://twitch.tv/kvrmelo" class="btn-s tw"><i class="fab fa-twitch"></i></a>
        </div>
    </header>

    <section id="portfolio">
        <h2>Moje Produkcje</h2>
        <div class="shorts-grid">
            <div class="short-card"><iframe src="https://www.youtube.com/embed/XQrDdlafN00"></iframe></div>
            <div class="short-card"><iframe src="https://www.youtube.com/embed/XQrDdlafN00"></iframe></div>
            <div class="short-card"><iframe src="https://www.youtube.com/embed/XQrDdlafN00"></iframe></div>
        </div>
    </section>

    <section id="contact">
        <h2>Współpraca</h2>
        <div class="contact-grid">
            <div class="contact-card" style="text-align: center;">
                <i class="fab fa-discord" style="font-size: 3rem; color: var(--dc); margin-bottom: 15px;"></i>
                <h3>Discord Community</h3>
                <p style="color: #666; margin: 10px 0;">Dołącz do mojego serwera lub napisz DM.</p>
                <button class="dc-btn" id="copyDc">KOPIUJ NICK: KVRMELO</button>
            </div>

            <div class="contact-card">
                <h3>Wyślij E-mail</h3>
                <form action="https://formspree.io/f/xqeyzypj" method="POST" style="margin-top: 20px;">
                    <input type="email" name="email" placeholder="Twój E-mail" required>
                    <textarea name="message" rows="4" placeholder="Twoja wiadomość..." required></textarea>
                    <button type="submit" class="send-btn">WYŚLIJ WIADOMOŚĆ</button>
                </form>
            </div>
        </div>
    </section>

    <footer style="padding: 100px 0 40px; text-align: center; color: #222; font-size: 10px; letter-spacing: 5px;">
        © 2026 KARMELO OFFICIAL HUB
    </footer>

    <script>
        // Animacja sekcji
        const obs = new IntersectionObserver((e) => {
            e.forEach(i => { if(i.isIntersecting) i.target.classList.add('visible'); });
        }, { threshold: 0.1 });
        document.querySelectorAll('section').forEach(s => obs.observe(s));

        // Kopiowanie Discorda
        document.getElementById('copyDc').addEventListener('click', function() {
            navigator.clipboard.writeText('kvrmelo');
            const originalText = this.innerText;
            this.innerText = 'SKOPIOWANO!';
            this.style.background = '#ffffff';
            this.style.color = '#000000';
            setTimeout(() => {
                this.innerText = originalText;
                this.style.background = 'var(--dc)';
                this.style.color = '#ffffff';
            }, 2000);
        });
    </script>
</body>
</html>
